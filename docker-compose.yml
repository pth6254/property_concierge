# docker-compose.yml — 운영 기준 베이스 설정.
#
# 이 파일 단독으로는 운영에 안전한 기본값을 유지한다: DB·Redis 포트를
# 호스트에 노출하지 않고, 소스코드는 이미지에 구운 것만 쓴다(볼륨 마운트 없음).
#
# 로컬 개발 편의(소스 핫리로드, DB 포트 호스트 노출, --reload)는
# docker-compose.override.yml 에 있다 — `docker compose up` 처럼 -f 없이 실행하면
# Compose가 두 파일을 자동 병합한다. 운영 배포는 override를 명시적으로 배제한다:
#
#   docker compose -f docker-compose.yml up -d --build
#
# 백업 스크립트(scripts/backup_db.sh 등)는 호스트 포트가 아니라 `docker exec`로
# 컨테이너 내부에 접속하므로 포트 미노출과 무관하게 그대로 동작한다.

services:

  # ────────────────────────────────────────────
  #  pgvector — PostgreSQL + pgvector 익스텐션
  # ────────────────────────────────────────────
  pgvector:
    image: ankane/pgvector:latest
    container_name: property_concierge_pgvector
    restart: unless-stopped
    environment:
      # 비밀번호는 저장소에 두지 않는다. .env 의 POSTGRES_PASSWORD 를 읽으며,
      # 미설정이면 `?` 문법으로 compose 가 즉시 실패한다 (기본값을 두면 그 값이
      # 그대로 운영에 올라가므로 일부러 폴백을 두지 않음).
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요. 예: openssl rand -base64 32}"
      POSTGRES_DB: ${POSTGRES_DB:-real_estate_db}
    # 호스트 포트 미노출 — api 컨테이너가 도커 내부 네트워크(pgvector:5432)로만 접속한다.
    # 로컬에서 psql·GUI 툴로 직접 붙어야 하면 override 파일이 5432:5432 를 되살린다.
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d real_estate_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ────────────────────────────────────────────
  #  Redis — 작업 큐 상태 · 레이트 리밋 · 로그인 잠금 카운터
  #  (이전에는 셋 다 API 프로세스 메모리에 있어 멀티 워커에서 상태가 갈렸다)
  # ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: property_concierge_redis
    restart: unless-stopped
    # Stream 작업 입력도 보관하므로 컨테이너 재시작 시 기록을 복구한다.
    command: ["redis-server", "--appendonly", "yes"]
    # 호스트 포트 미노출 — pgvector와 동일한 이유.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ────────────────────────────────────────────
  #  FastAPI 백엔드
  # ────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: property_concierge_backend:latest
    container_name: property_concierge_backend
    restart: unless-stopped
    depends_on:
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # app 테이블(auth/history/activity/cache/transactions/chat_corpus)과
      # RAG 벡터스토어(real_estate_docs)가 같은 pgvector 컨테이너를 공유한다.
      # 접속 문자열도 .env 의 비밀번호를 조합해 만든다 — 자격증명 하드코딩 금지.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?}@pgvector:5432/${POSTGRES_DB:-real_estate_db}
      PG_CONNECTION_STRING: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?}@pgvector:5432/${POSTGRES_DB:-real_estate_db}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_BIND_PORT:-8000}:8000"
    # 소스 볼륨 마운트 없음 — 이미지에 COPY 된 코드만 실행한다 (Dockerfile.backend).
    # 워커 수(UVICORN_WORKERS, 기본 4)는 Dockerfile ENV 로 정의되며 .env 에서 재정의 가능.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  job-worker:
    image: property_concierge_backend:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?}@pgvector:5432/${POSTGRES_DB:-real_estate_db}
      PG_CONNECTION_STRING: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?}@pgvector:5432/${POSTGRES_DB:-real_estate_db}
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "api.job_worker"]

  # 외부 API 할당량을 고려해 명시적으로 활성화하는 주기 재수집기.
  operations-monitor:
    image: property_concierge_backend:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?}@pgvector:5432/${POSTGRES_DB:-real_estate_db}
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "api.operational_health"]

  transaction-refresh:
    profiles: ["maintenance"]
    image: property_concierge_backend:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?}@pgvector:5432/${POSTGRES_DB:-real_estate_db}
      REDIS_URL: redis://redis:6379/0
      TRANSACTION_REFRESH_INTERVAL_HOURS: ${TRANSACTION_REFRESH_INTERVAL_HOURS:-168}
      TRANSACTION_REFRESH_MONTHS: ${TRANSACTION_REFRESH_MONTHS:-12}
      TRANSACTION_REFRESH_WORKERS: ${TRANSACTION_REFRESH_WORKERS:-2}
      TRANSACTION_REFRESH_SIDO: ${TRANSACTION_REFRESH_SIDO:-서울특별시}
    command: ["sh", "/app/scripts/run_transaction_refresh.sh"]

  # ────────────────────────────────────────────
  #  Next.js 프론트엔드
  # ────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: property_concierge_frontend:latest
    container_name: property_concierge_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgvector_data:
  redis_data:
