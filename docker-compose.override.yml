# docker-compose.override.yml — 로컬 개발 전용 오버레이.
#
# `docker compose up` 처럼 -f 없이 실행하면 Compose가 docker-compose.yml 과
# 이 파일을 자동으로 병합한다. 운영 배포처럼 -f 를 명시하면(-f docker-compose.yml)
# 이 파일은 무시된다 — 그래서 "운영용"과 "개발용"이 파일 하나에 조건문으로
# 뒤섞이지 않고 물리적으로 분리된다.
#
# 여기서 바꾸는 것:
#   1. api 소스코드를 볼륨 마운트해 코드 수정이 즉시 반영되게 하고(이미지 재빌드 불요),
#      --reload 로 저장 시 자동 재시작한다. --reload 는 --workers 와 함께 쓸 수 없어
#      개발 중에는 워커 1개로 돌린다 (멀티 워커 검증은 운영 compose 또는 그대로
#      --workers N 인 이미지를 docker compose up --build 로 띄워서 한다).
#   2. pgvector·redis 포트를 호스트에 노출해 로컬에서 psql·redis-cli·GUI 툴로
#      직접 접속할 수 있게 한다.

services:
  pgvector:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  api:
    volumes:
      - ./backend:/app/backend
      - ./api:/app/api
      - ./schemas:/app/schemas
      - ./data:/app/data
    command: ["sh", "-c", "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"]
