name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ────────────────────────────────────────────
  #  백엔드 — PostgreSQL·Redis 서비스 컨테이너 + pytest
  # ────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    # 앱 테이블·작업 큐·레이트 리밋이 전부 PostgreSQL/Redis 필수로 바뀌어
    # (SQLite/인프로세스 메모리 폴백 없음) 테스트도 실제 서비스 컨테이너가 필요하다.
    #
    # 아래 postgres 비밀번호는 워크플로 실행 중에만 존재하는 휘발성 컨테이너의
    # 값이라 운영 자격증명과 무관하다 — docker-compose.yml(실제 배포 설정)과
    # 달리 여기서는 하드코딩해도 유출 리스크가 없어 의도적으로 그대로 둔다.
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: real_estate_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d real_estate_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 테스트는 외부 API·LLM 없이 도는 것만 대상으로 한다.
      DISABLE_RATE_LIMIT: "1"
      APP_ENV: development
      JWT_SECRET_KEY: ci-test-secret-not-used-in-production
      DATABASE_URL: postgresql://postgres:password@localhost:5432/real_estate_db
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 실제 배포 경로(Dockerfile.backend)와 동일하게 워커·테스트 이전에
      # 마이그레이션을 먼저 적용한다 — 이렇게 해야 새 마이그레이션 파일이
      # db/models.py 와 어긋나거나 깨진 채로 머지되는 것을 CI에서 잡아낸다.
      # (pytest만 돌리면 lifespan의 create_all() 안전망이 이 오류를 가려버린다.)
      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v --junitxml=evaluation-results/backend-junit.xml

      # 실제 모델 호출은 수동 평가로 분리해 CI가 API 키·모델 응답에 의존하지 않게 한다.
      - name: Evaluate decision support and offline fixtures
        run: python -m evaluation run --suite all --timeout 30

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser verification dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify listing to decision browser flow
        env:
          BROWSER_TEST_DB: "1"
          E2E_BROWSER: chromium
          PLAYWRIGHT_MODULE_PATH: ${{ github.workspace }}/frontend/node_modules/playwright
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          python scripts/seed_browser_regions.py
          uvicorn api.main:app --host 127.0.0.1 --port 8000 > /tmp/property-e2e-backend.log 2>&1 &
          python -m api.job_worker > /tmp/property-e2e-worker.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health >/dev/null
          node scripts/verify_listing_import_browser.cjs http://127.0.0.1:8000
          node scripts/verify_navigation_browser.cjs http://127.0.0.1:8000

      - name: Save decision flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-flow-evidence
          path: |
            evaluation-results/backend-junit.xml
            evaluation-results/decision-flow-browser.json
            evaluation-results/listing-import-browser.png
            evaluation-results/navigation-browser.json
            evaluation-results/navigation-*.png
          if-no-files-found: ignore

  # ────────────────────────────────────────────
  #  프론트엔드 — 타입 체크 + 프로덕션 빌드
  #
  #  프론트엔드에는 아직 테스트가 없다. 최소한 타입 오류와 빌드 실패는
  #  머지 전에 걸러낸다 (백엔드 job과 독립적이라 병렬로 실행된다).
  # ────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
