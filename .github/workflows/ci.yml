name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ────────────────────────────────────────────
  #  백엔드 — PostgreSQL·Redis 서비스 컨테이너 + pytest
  # ────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    # 앱 테이블·작업 큐·레이트 리밋이 전부 PostgreSQL/Redis 필수로 바뀌어
    # (SQLite/인프로세스 메모리 폴백 없음) 테스트도 실제 서비스 컨테이너가 필요하다.
    #
    # 아래 postgres 비밀번호는 워크플로 실행 중에만 존재하는 휘발성 컨테이너의
    # 값이라 운영 자격증명과 무관하다 — docker-compose.yml(실제 배포 설정)과
    # 달리 여기서는 하드코딩해도 유출 리스크가 없어 의도적으로 그대로 둔다.
    env:
      # 러너에서만 존재하는 검증 전용 값이다. 운영 자격증명을 사용하지 않는다.
      POSTGRES_PASSWORD: python-ci-password
      POSTGRES_DB: real_estate_test
      JWT_SECRET_KEY: ci-test-secret-not-used-in-production
      INTERNAL_SERVICE_SECRET: ci-internal-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Start isolated infrastructure and build Kotlin tests
        run: |
          touch .env
          docker compose up -d pgvector redis
          docker compose -f docker-compose.yml build api core

      - name: Reject duplicate Python HTTP routes
        run: python scripts/audit_python_routes.py

      - name: Run Python regressions through isolated Kotlin contracts
        run: python scripts/run_isolated_tests.py tests/ -v --junitxml=evaluation-results/backend-junit.xml

      - name: Evaluate decision support and offline fixtures
        run: python scripts/run_spring_tests.py --evaluation

      - name: Save decision flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-flow-evidence
          path: |
            evaluation-results/backend-junit.xml
            evaluation-results/decision-flow-browser.json
            evaluation-results/listing-import-browser.png
            evaluation-results/navigation-browser.json
            evaluation-results/navigation-*.png
            evaluation-results/service-quality-browser.json
            evaluation-results/service-quality-*.png
            evaluation-results/funding-browser*.json
            evaluation-results/funding-browser*.png
            evaluation-results/assessment-browser*.json
            evaluation-results/assessment-browser*.png
            evaluation-results/address-browser*.json
            evaluation-results/address-browser*.png
          if-no-files-found: ignore

      - name: Remove isolated infrastructure
        if: always()
        run: docker compose down -v

  # ────────────────────────────────────────────
  #  프론트엔드 — 타입 체크 + 프로덕션 빌드
  #
  #  프론트엔드에는 아직 테스트가 없다. 최소한 타입 오류와 빌드 실패는
  #  머지 전에 걸러낸다 (백엔드 job과 독립적이라 병렬로 실행된다).
  # ────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # 다른 job과 독립된 러너에서만 DB·Redis를 만들므로 Python 테스트와 저장소가 겹치지 않는다.
  spring:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 러너 종료와 함께 삭제되는 검증 전용 자격증명이다. 운영 .env를 복사하지 않는다.
      POSTGRES_PASSWORD: spring-ci-password
      POSTGRES_DB: real_estate_test
      JWT_SECRET_KEY: spring-ci-jwt-secret-not-used-in-production
      INTERNAL_SERVICE_SECRET: spring-ci-internal-secret-not-used-in-production
      E2E_BROWSER: chromium
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install integration dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start isolated infrastructure and build Kotlin tests
        run: |
          touch .env
          python scripts/check_compose_contract.py
          docker compose up -d pgvector redis
          docker compose -f docker-compose.yml build api core
      - name: Verify native storage, jobs and browser decision flow
        run: python scripts/run_spring_tests.py --browser
      - name: Save Spring flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-flow-evidence
          path: |
            evaluation-results/spring-core-result.json
            evaluation-results/spring-gateway-result.json
            evaluation-results/core-calculations-result.json
            evaluation-results/decision-flow-browser.json
            evaluation-results/navigation-browser.json
            evaluation-results/funding-browser*.json
            evaluation-results/assessment-browser*.json
            evaluation-results/service-quality-browser.json
            evaluation-results/address-browser-result.json
            evaluation-results/*browser*.png
          if-no-files-found: ignore
      - name: Remove isolated containers
        if: always()
        run: docker compose down -v
