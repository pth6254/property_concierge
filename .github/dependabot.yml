# 의존성 갱신 PR. 보안 취약점 알림·보안 갱신은 GitHub 저장소 설정(Code security)에서 함께 켠다.
# 같은 생태계의 minor·patch는 한 PR로 묶어 리뷰 부담을 줄이고, major는 따로 연다. 모든 PR은 기존 CI(test·frontend·spring)를 통과해야 병합한다.
# Docker 베이스 이미지는 python:3.11-slim처럼 버전 계열 태그라 여기서 올리지 않는다. 보안 패치는 배포 때 `build --pull`로 반영한다(docs/operations.md 배포 절차 9).
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    # 큰 버전 업은 도구·프레임워크 지원을 확인한 뒤 별도 작업으로 올린다(2026-11-11: TypeScript 7·ESLint 10은
    # typescript-eslint·eslint-config-next 미지원으로 설치·린트 실패). @types/node는 실행 환경(Node 22)에 맞춘다.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        versions: [">=23"]

  - package-ecosystem: maven
    directory: /services/platform
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      platform-minor-patch:
        update-types: [minor, patch]
    # Spring Boot 4는 Jackson 3 등 대형 이전이라 별도 작업으로 진행한다(2026-11-11 PR #4 컴파일 실패).
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]

  # 가격 모델(CatBoost)·임베딩 관련 패키지가 바뀌면 AVM 재학습·법령 검색 평가 결과가 달라질 수 있다.
  # 해당 PR은 테스트 통과만으로 병합하지 말고 services/intelligence/evaluation의 평가를 다시 확인한다.
  - package-ecosystem: pip
    directory: /services/intelligence
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      intelligence-minor-patch:
        update-types: [minor, patch]
    # SQLAlchemy 2.1은 postgresql:// 기본 드라이버를 psycopg(3)로 바꾼다. psycopg2에서 옮기는 작업을 따로 하기 전까지 2.0 줄을 유지한다(2026-11-11 PR #9).
    ignore:
      - dependency-name: "sqlalchemy"
        versions: [">=2.1"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Seoul
    groups:
      actions:
        patterns: ["*"]
