# 운영 배포에서는 development override 대신 이 파일을 명시적으로 사용한다.

# LangSmith 추적은 LLM 호출의 입력·출력(상담 질문·대화 맥락·조건)을 국외 서비스로 보낸다. 개인정보처리방침에 없으므로 운영에서는 끈다(AGENTS 2-16).
# 켜려면 방침 5·6항에 LangSmith를 먼저 추가한 뒤 .env에 LANGSMITH_PRODUCTION_TRACING=true와 LANGSMITH_API_KEY를 둔다.
# 라이브러리는 LANGSMITH_TRACING_V2 → LANGCHAIN_TRACING_V2 → LANGSMITH_TRACING → LANGCHAIN_TRACING 순으로 읽으므로
# 넷을 같은 값으로 고정한다(.env에 개발용 LANGSMITH_TRACING=true나 옛 이름이 남아 있어도 운영에서 켜지지 않게). compose.vercel.yml도 같다.
x-production-tracing: &production-tracing
  LANGSMITH_TRACING_V2: ${LANGSMITH_PRODUCTION_TRACING:-false}
  LANGCHAIN_TRACING_V2: ${LANGSMITH_PRODUCTION_TRACING:-false}
  LANGSMITH_TRACING: ${LANGSMITH_PRODUCTION_TRACING:-false}
  LANGCHAIN_TRACING: ${LANGSMITH_PRODUCTION_TRACING:-false}

services:
  # 임베딩 전용 Ollama. 법령 검색(law_retrieval)은 코퍼스를 만든 qwen3-embedding:4b(embed_property_laws.MODEL)로 질의를 임베딩하고
  # DB 벡터의 모델 지문(digest)과 같을 때만 검색한다. 다른 모델·다른 지문이면 법령 검색이 조용히 꺼지므로 같은 모델을 서버 안에서 실행한다.
  # 대화 LLM은 OpenRouter 등 외부 제공자를 쓴다. 첫 기동 때 모델을 받아 볼륨에 보관한다(인터넷 필요, 약 2.5GB). 포트는 외부에 열지 않는다.
  ollama:
    image: ollama/ollama:0.12.6
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & pid=$$!; sleep 5; ollama pull qwen3-embedding:4b || true; wait $$pid"]
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      # 법령 조각은 최장 1,091자(2026-11-01). 문맥을 4,096으로 줄여 메모리 5.7GB → 3.3GB, 벡터는 동일함을 확인했다.
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama_models:/root/.ollama
  api:
    ports: !reset []
    environment:
      <<: *production-tracing
      OLLAMA_HOST: http://ollama:11434
      APP_ENV: production
      FORWARDED_ALLOW_IPS: 172.31.244.2
      COOKIE_SAMESITE: lax
      FRONTEND_URL: https://${SERVICE_DOMAIN:?SERVICE_DOMAIN을 설정하세요}
      CORS_ORIGINS: https://${SERVICE_DOMAIN:?}
  job-worker:
    environment:
      <<: *production-tracing
      OLLAMA_HOST: http://ollama:11434
  # 아래 셋은 현재 LLM을 호출하지 않지만 같은 Python 이미지와 .env를 쓰므로 함께 고정한다.
  operations-monitor:
    environment:
      <<: *production-tracing
  transaction-refresh:
    environment:
      <<: *production-tracing
  avm-retrain:
    environment:
      <<: *production-tracing
  core:
    ports: !reset []
    environment:
      APP_ENV: production
      COOKIE_SAMESITE: lax
      # Google 로그인 콜백·비밀번호 재설정 링크는 Spring이 만든다. .env의 localhost 값이 운영에 남지 않도록 도메인으로 고정한다.
      FRONTEND_URL: https://${SERVICE_DOMAIN:?}
      GOOGLE_REDIRECT_URI: https://${SERVICE_DOMAIN:?}/api/auth/google/callback
  gateway:
    environment:
      SERVICE_DOMAIN: ${SERVICE_DOMAIN:?}
    ports: !override ["80:80", "443:443"]
    volumes:
      - ./infrastructure/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway_data:/data
      - gateway_config:/config
    networks:
      ingress:
        ipv4_address: 172.30.92.2
volumes:
  ollama_models:
  gateway_data:
  gateway_config:
