# 저장소 루트 기준 경로를 사용한다. scripts/compose.sh로 프로젝트 경로·이름을 고정한다.
# local: 베이스만 / dev: 개발 오버레이 병합 / production: HTTPS 운영 오버레이 병합

services:
  pgvector:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  api:
    volumes:
      - ./services/intelligence/backend:/app/services/intelligence/backend
      - ./services/intelligence/api:/app/services/intelligence/api
      - ./services/intelligence/schemas:/app/services/intelligence/schemas
      - ./data:/app/data
    command: ["sh", "-c", "alembic -c services/intelligence/alembic.ini upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"]
