# Vercel이 웹(Next.js)을 맡고 이 서버는 API·데이터·작업 실행기만 운영한다. compose.yml에 겹쳐 쓴다.
#   sh scripts/compose.sh vercel --profile maintenance up -d --build
# 브라우저 → Vercel 도메인(/api/* 리라이트) → API_DOMAIN의 Caddy(Caddyfile.api) → Spring. 브라우저 입장에서 같은 출처라
# 쿠키는 SameSite=lax를 유지한다(AGENTS 2-8). 웹 컨테이너는 띄우지 않는다.
services:
  # 임베딩 전용 Ollama. 법령 검색(law_retrieval)은 코퍼스를 만든 qwen3-embedding:4b(embed_property_laws.MODEL)로 질의를 임베딩하고
  # DB 벡터의 모델 지문(digest)과 같을 때만 검색한다. 다른 모델·다른 지문이면 법령 검색이 조용히 꺼지므로 같은 모델을 서버 안에서 실행한다.
  # 대화 LLM은 OpenRouter 등 외부 제공자를 쓴다. 첫 기동 때 모델을 받아 볼륨에 보관한다(인터넷 필요, 약 2.5GB). 포트는 외부에 열지 않는다.
  ollama:
    image: ollama/ollama:0.12.6
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & pid=$$!; sleep 5; ollama pull qwen3-embedding:4b || true; wait $$pid"]
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      # 법령 조각은 최장 1,091자(2026-11-01). 문맥을 4,096으로 줄여 메모리 5.7GB → 3.3GB, 벡터는 동일함을 확인했다.
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama_models:/root/.ollama
  api:
    ports: !reset []
    environment:
      OLLAMA_HOST: http://ollama:11434
      APP_ENV: production
      FORWARDED_ALLOW_IPS: 172.31.244.2
      COOKIE_SAMESITE: lax
      FRONTEND_URL: https://${WEB_DOMAIN:?WEB_DOMAIN(Vercel 웹 도메인)을 설정하세요}
      CORS_ORIGINS: https://${WEB_DOMAIN:?}
  job-worker:
    environment:
      OLLAMA_HOST: http://ollama:11434
  core:
    ports: !reset []
    environment:
      APP_ENV: production
      COOKIE_SAMESITE: lax
      # Google 콜백·재설정 링크는 사용자가 보는 웹 도메인이어야 한다. 콜백도 Vercel 리라이트로 Spring에 온다.
      FRONTEND_URL: https://${WEB_DOMAIN:?}
      GOOGLE_REDIRECT_URI: https://${WEB_DOMAIN:?}/api/auth/google/callback
  frontend:
    # Vercel이 웹을 배포하므로 이 서버에서는 실행하지 않는다(명시적으로 프로필을 켤 때만 실행).
    profiles: ["docker-web"]
  gateway:
    depends_on: !override
      core:
        condition: service_healthy
    environment:
      API_DOMAIN: "${API_DOMAIN:?API_DOMAIN(예 api.example.com)을 설정하세요}"
      EDGE_PROXY_SECRET: "${EDGE_PROXY_SECRET:?Vercel과 같은 32자 이상 EDGE_PROXY_SECRET을 설정하세요}"
    ports: !override ["80:80", "443:443"]
    volumes: !override
      - ./infrastructure/proxy/Caddyfile.api:/etc/caddy/Caddyfile:ro
      - gateway_data:/data
      - gateway_config:/config
    networks:
      ingress:
        ipv4_address: 172.30.92.2

volumes:
  ollama_models:
  gateway_data:
  gateway_config:
